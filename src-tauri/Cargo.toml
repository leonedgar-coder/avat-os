[package]
name = "avat-os"
version = "0.1.0"
description = "Estudio de VTuber open source: avatar 3D + escenas, audio y grabación"
authors = ["avat-os contributors"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata]
# Caché de la descarga de OBS (ignorada por git)
libobs-cache-dir = "../obs-build"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "avat_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Descarga los binarios oficiales de OBS (libobs + plugins) a la carpeta target.
cargo-obs-build = { version = "3", default-features = false }
# Para reponer las DLL que necesita obs-browser (ver build.rs).
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libobs-wrapper = "10"
libobs-simple = "9"
raw-window-handle = "0.6"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tauri-plugin-dialog = "2"
tiny_http = "0.12"
tungstenite = "0.30"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Ícono grande de la ventana (barra de tareas), ver src/win_icon.rs; nombre de las teclas de
# símbolos según el teclado de la persona, ver src/shortcuts.rs.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
