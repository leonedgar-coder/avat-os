# Spike 1 — Fase 0: comprobar que podemos controlar libobs desde Rust
# y grabar 5 segundos de la pantalla a MP4.
[package]
name = "obs-record"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
libobs-cache-dir = "../../obs-build"

[dependencies]
libobs-wrapper = "10"
libobs-simple = "9"
anyhow = "1"
env_logger = "0.11"

[build-dependencies]
cargo-obs-build = { version = "3", default-features = false }
